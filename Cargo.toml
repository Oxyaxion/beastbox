[package]
name = "beastbox"
version = "0.16.2"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
# Exposes the internal parsers to fuzzing (fuzz/); never for the shipped binary.
fuzzing = []

[dependencies]
argon2 = "0.6.0"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64ct = { version = "1.8", features = ["alloc"] }
bytes = "1"
crc32fast = "1.5.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
httpdate = "1.0.3"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "server-graceful", "http1"] }
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["platform_independent"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
libc = "0.2.191"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tower-service = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
# fs/ is the only module allowed to use unsafe (extattr FFI, openat, Capsicum): it carries a #![allow(unsafe_code)].
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
