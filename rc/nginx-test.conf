# TEST vhost (beastbox jail, LAN only, cleartext HTTP). Do not use as is in production:
# production goes through nginx-rproxy, which terminates TLS.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;   # streamed responses (PROPFIND, GET): otherwise ~40 ms added (measured, docs/dev/VALIDATION.md §7)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  # test: keeps the port (:8480) in generated URLs; in production behind 443, $host is enough
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;   # overwrites any client value: used by the failure limits
        proxy_set_header X-Forwarded-Host "";
    }
}
