{% if !copy.is_empty() %}<button type="button" class="js copier-texte" data-copier="{{ copy }}" data-ok="{{ lang.t("Copied") }}" data-ko="{{ lang.t("Copy failed") }}" title="{{ lang.t("Copy the contents") }}" aria-label="{{ lang.t("Copy the contents of") }} {{ name }}"><span class="ico ico-copy" aria-hidden="true"></span><span class="invisible" role="status"></span></button>{% endif %}
